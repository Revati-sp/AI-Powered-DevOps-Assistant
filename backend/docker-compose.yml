services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-assistant-api
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://devops:devops@db:5432/devops_assistant
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: docker-compose-dev-secret-change-in-production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - .:/app
    networks:
      - devops-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-assistant-worker
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://devops:devops@db:5432/devops_assistant
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: docker-compose-dev-secret-change-in-production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    volumes:
      - .:/app
    networks:
      - devops-net

  db:
    image: postgres:16-alpine
    container_name: devops-assistant-db
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops
      POSTGRES_DB: devops_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devops_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devops-net

  redis:
    image: redis:7-alpine
    container_name: devops-assistant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devops-net

volumes:
  postgres_data:
  redis_data:

networks:
  devops-net:
    driver: bridge
