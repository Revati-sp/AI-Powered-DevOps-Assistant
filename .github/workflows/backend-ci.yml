name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devops
          POSTGRES_PASSWORD: devops
          POSTGRES_DB: devops_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devops -d devops_assistant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      SECRET_KEY: ci-test-secret-key-123456
      DATABASE_URL: postgresql+asyncpg://devops:devops@localhost:5432/devops_assistant
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      RATE_LIMIT_ENABLED: "false"
      OTEL_ENABLED: "false"
      METRICS_ENABLED: "true"
      GEMINI_API_KEY: test
      LLAMA_API_KEY: test
      MISTRAL_API_KEY: test
      ALLOW_INSECURE_LLM_HTTP: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: MyPy
        run: mypy app

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Alembic check
        run: alembic check

      - name: Pytest with coverage
        run: >
          pytest
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=85

      - name: Application import test
        run: python -c "from app.main import app; print(app.title)"

      - name: OpenAPI dump test
        run: python -c "from app.main import app; import json; json.dumps(app.openapi())"

      - name: Docker Compose config
        run: docker compose config

      - name: Docker build
        run: docker build .

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit || true

      - name: gitleaks scan
        run: |
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --source .. --no-banner --redact
          else
            echo "gitleaks not installed; skipping secret scan"
          fi
